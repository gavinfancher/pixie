# Proxy DHCP: UniFi keeps handing out IP addresses. We answer only the
# "which boot file?" part of the same broadcast, so nothing else changes.
dhcp-range=10.0.0.0,proxy

# We are a boot server, not a DNS server. Turn DNS off.
port=0

# Log every exchange. This is how we debug a machine that won't boot.
log-dhcp

# Hand out files from /tftp inside the container.
enable-tftp
tftp-root=/tftp

# A machine that is NOT yet running iPXE gets iPXE itself.
# dnsmasq picks the matching line using the architecture the firmware reports.
pxe-service=tag:!ipxe,x86-64_EFI,"pixie",ipxe.efi
pxe-service=tag:!ipxe,BC_EFI,"pixie",ipxe.efi

# iPXE announces itself with DHCP option 175. Without this tag we would hand
# iPXE another copy of iPXE, forever.
dhcp-match=set:ipxe,175

# A machine that IS running iPXE gets our script instead.
dhcp-boot=tag:ipxe,boot.ipxe

# Skip the "press F8 for menu" prompt.
pxe-prompt="pixie",0
