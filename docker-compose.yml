services:
  bootstrap:
    build:
      context: ./docker
      dockerfile: Dockerfile.bootstrap
    user: "1000:1000"
    working_dir: /pixie
    volumes:
      - ./:/pixie
    command: ./scripts/bootstrap.sh
    restart: "no"

  dnsmasq:
    build:
      context: ./docker
      dockerfile: Dockerfile.dnsmasq
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
      - ./boot:/boot:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./images:/usr/share/nginx/html/images:ro
      - ./autoinstall:/usr/share/nginx/html/autoinstall:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
